server {
    listen 80;
    server_name dns.chrisshop.com www.dns.chrisshop.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dns.chrisshop.com www.dns.chrisshop.com;

    root /var/www/dns/chrisshop.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.dns.chrisshop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.dns.chrisshop.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://198.169.100.30:443/;

        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
